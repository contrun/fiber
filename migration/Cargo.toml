[package]
name = "fnn-migrate"
version = "0.2.1"
edition = "2021"
build = "build.rs"

[dependencies]
rocksdb = { package = "ckb-rocksdb", version = "=0.21.1", features = [
    "lz4"
], default-features = false }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.16"
console = "0.15.8"
bincode = "1.3.3"
thiserror = "1.0.58"
serde = { version = "1.0.197", features = ["derive"] }
hex = "0.4.3"
clap = { version = "4.0", features = ["derive"] }
fiber = { package = "fnn", path = "../" }
serde_json = "1.0.135"

fiber_v020 = { package = "fnn", git = "https://github.com/contrun/fiber.git", rev = "2ac80280bac1f76c19615150d32ee847b82f8777" }
fiber_v021 = { package = "fnn", git = "https://github.com/contrun/fiber.git", rev = "28cc8c6d3f11bcfe7994d96dc161c36ca42102f0" }
fiber_v022 = { package = "fnn", git = "https://github.com/contrun/fiber.git", rev = "b906be716f8848bd3113624cc74c54e95825d63e" }
ciborium = "0.2.2"

[features]
default = []
portable = ["rocksdb/portable"]

